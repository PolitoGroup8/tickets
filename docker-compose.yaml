name: group8-tickets

services:

  postgres:
    image: postgres:17
    container_name: tickets-db
    ports:
      - "${TICKETS_DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${TICKETS_DB_NAME}
      POSTGRES_USER: ${TICKETS_DB_USER}
      POSTGRES_PASSWORD: ${TICKETS_DB_PASSWORD}
    volumes:
      - postgres_data_tickets:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TICKETS_DB_USER} -d ${TICKETS_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: tickets-pgadmin
    ports:
      - "${TICKETS_PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${TICKETS_PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${TICKETS_PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

# ------------------------------------------------------------
# Persistent volumes
# ------------------------------------------------------------
volumes:
  postgres_data_tickets:
  pgadmin_data:
