name: group8-tickets

services:

  postgres:
    image: postgres:17
    container_name: tickets-db
    ports:
      - "${TICKETS_DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${TICKETS_DB_NAME}
      POSTGRES_USER: ${TICKETS_DB_USER}
      POSTGRES_PASSWORD: ${TICKETS_DB_PASSWORD}
    volumes:
      - postgres_data_tickets:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TICKETS_DB_USER} -d ${TICKETS_DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: tickets-pgadmin
    ports:
      - "${TICKETS_PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${TICKETS_PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${TICKETS_PGADMIN_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  rustfs:
    image: rustfs/rustfs:1.0.6
    command: ["/data"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-}"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 30
  rustfs-init:
    image: rustfs/rc:v0.1.36
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:-}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:-}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /usr/bin/rc alias set local http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"
        /usr/bin/rc bucket create local/ticket-qr --ignore-existing
# ------------------------------------------------------------
# Persistent volumes
# ------------------------------------------------------------
volumes:
  postgres_data_tickets:
  pgadmin_data:
  rustfs_data:
